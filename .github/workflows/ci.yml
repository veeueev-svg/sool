# سير عمل التكامل المستمر — إنفاذ القاعدة الحاكمة RULE-000
# المالك: القيّم على المستودع | الوثيقة المرتبطة: GOVERNING_RULE.md
name: بوابة التاج — بناء واختبار وتوثيق

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: بناء + اختبار + سلامة السجل + مدقّق التوثيق
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # بلا هذه الخطوة لا يوجد `tsc` على العارض، فتسقط أول خطوة وتُتخطّى كل الحواجز بعدها:
      # وهو ما وقع في كل تشغيلات البوابة قبل إغلاق البند T-117 — حاجزٌ معلن لم يُشغَّل قطّ.
      - name: تثبيت أدوات البناء من القفل (بلا تبعيات تشغيل)
        run: npm ci
      - name: تحقق الأنواع والبناء
        run: npm run build
      - name: اختبارات القبول
        run: npm test
      - name: التحقق من سلامة سجل التدقيق
        run: node dist/scripts/verify_audit_chain.js
      - name: حدود حجم الوحدة (يفشل إذا تجاوز ملفٌ سقفه المعلن في config/module_limits.yaml)
        run: bash scripts/check_module_size.sh
      - name: تطابق حالات معايير القبول مع أحكام التدقيق (T-116)
        run: bash scripts/check_criteria_status.sh
      - name: منع المسارات المطلقة في الشفرة والاختبارات والأدوات (T-118)
        run: bash scripts/check_absolute_paths.sh
      - name: حاجزُ الإعلان — يمنع دعوى 100% وثمّ فجوةٌ أو بندٌ مفتوح (T-127)
        run: bash scripts/check_declaration.sh
      - name: فاحصُ الأرقام المنقولة — جدولُ المجلدات وعددُ الاختبارات يُولَّدان من مصدرهما (T-128)
        run: bash scripts/check_generated_numbers.sh
      - name: مدقّق التوثيق (يفشل إذا تغيّر src بلا PROGRESS.md وتقرير اختبار)
        run: bash scripts/check_documentation.sh
