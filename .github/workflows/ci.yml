# سير عمل التكامل المستمر — إنفاذ القاعدة الحاكمة RULE-000
# المالك: القيّم على المستودع | الوثيقة المرتبطة: GOVERNING_RULE.md
name: بوابة التاج — بناء واختبار وتوثيق

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: بناء + اختبار + سلامة السجل + مدقّق التوثيق
    runs-on: ubuntu-latest
    steps:
      # الوسمُ v5 لا v4: بيانُ الإجراءِ نفسُه (action.yml) يقول على v4 `runs.using: node20`
      # والعارضُ يرفعه قسرًا إلى node24 — فالمُعلَنُ ليس المنفَّذ، وv5 يُعلن node24 (T-146).
      # وهذا زمنُ تشغيلِ الإجراءِ لا زمنُ المشروع: node-version أدناه يبقى 20 كما في الجذرِ المحلّيّ.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      # بلا هذه الخطوة لا يوجد `tsc` على العارض، فتسقط أول خطوة وتُتخطّى كل الحواجز بعدها:
      # وهو ما وقع في كل تشغيلات البوابة قبل إغلاق البند T-117 — حاجزٌ معلن لم يُشغَّل قطّ.
      - name: تثبيت أدوات البناء من القفل (بلا تبعيات تشغيل)
        run: npm ci
      - name: تحقق الأنواع والبناء
        run: npm run build
      - name: اختبارات القبول
        run: npm test
      # T-163 (W-2026-021): عند سقوطِ خطوةِ الاختباراتِ تُكتبُ أسطرُ الأحكامِ الساقطةِ إلى
      # ملخّصِ التشغيلِ فتُقرأُ من صفحةِ التشغيلِ دون مضيفِ السجلِّ المحجوب. والخطوةُ `if: failure()`
      # لا تُغيّرُ الحكمَ: لا تُشغَّلُ إلّا بعدَ سقوطِ خطوةٍ سابقةٍ (الوظيفةُ حمراءُ أصلًا)، ورمزُ
      # خروجِها 0 (افتراضيًّا) فلا تُسوّدُ أخضرَ ولا تُخضِرُ أحمرَ. ولا إعادةَ محاولةٍ ولا ابتلاعَ فشلٍ.
      - name: إخراجُ أسطرِ الأحكامِ الساقطةِ إلى ملخّصِ التشغيل (T-163)
        if: failure()
        run: bash scripts/t163_failure_summary.sh
      - name: التحقق من سلامة سجل التدقيق
        run: node dist/scripts/verify_audit_chain.js
      - name: حدود حجم الوحدة (يفشل إذا تجاوز ملفٌ سقفه المعلن في scripts/limits/module_limits.yaml)
        run: bash scripts/check_module_size.sh
      - name: تطابق حالات معايير القبول مع أحكام التدقيق (T-116)
        run: bash scripts/check_criteria_status.sh
      - name: منع المسارات المطلقة في الشفرة والاختبارات والأدوات (T-118)
        run: bash scripts/check_absolute_paths.sh
      - name: حاجزُ الإعلان — يمنع دعوى 100% وثمّ فجوةٌ أو بندٌ مفتوح (T-127)
        run: bash scripts/check_declaration.sh
      - name: حاجزُ قُرّاءِ الإعلان — لا ملفَّ تهيئةٍ بلا قارئٍ مسجَّل ولا قارئَ بلا ملف (T-137)
        run: bash scripts/check_config_readers.sh
      - name: فاحصُ الأرقام المنقولة — جدولُ المجلدات وعددُ الاختبارات يُولَّدان من مصدرهما (T-128)
        run: bash scripts/check_generated_numbers.sh
      # الحواجزُ الثلاثةُ التالية كانت في سلسلة `verify` ولا تُشغَّل هنا منذ 2026-08-23،
      # وأحدُها هو الحاجزُ الذي أُعيدت كتابتُه في W-2026-006 — فحاجزٌ لا يُشغَّل على الدمج
      # حاجزٌ بالاسم وحدَه (RULE-001 · T-148). وترتيبُها هنا كترتيبِها في `verify` قصدًا.
      - name: حاجزُ التعدادات المغلقة — لا تعدادَ قيمٍ مغلقًا بلا سجلٍّ أو استثناءٍ بسبب (T-136)
        run: bash scripts/check_closed_enums.sh
      - name: حاجزُ عملِ الإقلاع — الزمنُ يُحرس بعدِّ العمل لا بالساعة (T-134)
        run: bash scripts/check_boot_work.sh
      - name: حاجزُ الحصر على مستوى النواة (T-16)
        run: node dist/scripts/check_confinement.js
      - name: حاجزُ حصرِ الإرجاع — لا صنفَ في نطاق التدوين بلا مستهلكِ إرجاعٍ مُعلَن (W-2026-040)
        run: node dist/scripts/check_rehydrate_census.js
      - name: بوابةُ الدمجِ مقابلَ سلسلةِ التحقّق — لا حاجزَ يُقاس عليه محلّيًّا ولا يُشغَّل هنا (T-148 · T-146)
        run: bash scripts/check_ci_gates.sh
      - name: مدقّق التوثيق (يفشل إذا تغيّر src بلا PROGRESS.md وتقرير اختبار)
        run: bash scripts/check_documentation.sh

      - name: بوابةُ ضبط العمل — يفشل إذا تغيّر مسارٌ محكومٌ بلا بندِ عملٍ يحجزه (RULE-010..017)
        run: npm run check:work
