# deploy/production/runbooks/king-absence.yaml — خطوات كتاب غياب الملك (المرحلة 37)
# القارئ: src/staging/manifest.ts · المنفّذ: src/production/production_runbook_steps.ts
runbook:
  name: king-absence
  purpose: إثبات أن غياب الملك يُكشف ويُخرج الدولة إلى وضع الحماية وأن العودة تُرجعها
  steps:
    - n: 1
      title: إثبات حضور النبض الملكي وأن الوضع طبيعي
      expect: النبض حاضر والوضع المشتق طبيعي قبل قياس الغياب
    - n: 2
      title: قياس أن الغياب يُكشف في زمن يجاوز المهلة المعلنة
      expect: الوضع المشتق في الزمن البعيد وقائي — قياسٌ لا يغيّر الحال
    - n: 3
      title: تجديد النبض وإثبات عودة الوضع طبيعيًّا
      expect: الوضع طبيعي بعد تجديد النبض فلا يبقى الوضع الوقائي أثرًا للقياس
