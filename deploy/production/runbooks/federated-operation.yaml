# deploy/production/runbooks/federated-operation.yaml — خطوات كتاب التشغيل الاتحادي (المرحلة 37)
# القارئ: src/staging/manifest.ts · المنفّذ: src/production/production_runbook_steps.ts
runbook:
  name: federated-operation
  purpose: إثبات أن الأقاليم الأربعة تعمل فعلًا تحت مرور التاج وأن المراقبة جارية
  steps:
    - n: 1
      title: إثبات سلامة سلسلة التدقيق قبل فتح المرور
      expect: السلسلة تتحقّق فلا تُبنى شهادة على سجل مكسور
    - n: 2
      title: إثبات أن كل إقليم مشترط قائم ومفوَّض وله حاكم
      expect: الأقاليم الأربعة قائمة ولكل واحد نطاق مفوَّض وحاكم جالس
    - n: 3
      title: محاولة فعل إقليمي بلا إذن مرور وإثبات رفضها وتقييدها
      expect: الفعل مرفوض ومقيَّد في السجل دليلًا على الإنفاذ لا على دعواه
    - n: 4
      title: منح إذن مرور بأمر ملكي لكل إقليم وتنفيذ فعله
      expect: لكل إقليم مشترط فعلٌ نفُذ وإذنٌ استُوفي مقيَّدان في السجل
    - n: 5
      title: إثبات أن المراقبة المستمرة جارية ومسحت
      expect: المراقبة جارية وعدد مسحاتها لا يقلّ عن واحدة
