# الحصرُ على مستوى النواة والحاوية (المرحلة 39 — البند T-16، إكمالُ C-09)
# المالك: وزارة الأمن السيبراني
#
# لماذا هذا الملف: قاس المدقّق في C-09 أن الرفضَ هو الافتراض **داخل العملية**، ثم أعلن
# الفجوة بنصّها: «المنعُ تطبيقيٌّ داخل العملية فقط؛ الحصر على مستوى الحاوية والنواة
# غير قائم». المنعُ التطبيقي يسقط بسقوط أول ثغرة في الشيفرة نفسها: من خرج من البوابة
# لم يخرج من النواة. فما يُشترط هنا شرطٌ على العمليّة لا على وحدةٍ فيها.
#
# القاعدة الحاكمة RULE-005: السياسة واحدة لا اثنتان. قائمةُ المضيفين المسموح بها
# **لا تُكرَّر هنا** — مصدرها الوحيد `config/external.yaml`، ومنشوراتُ الشبكة في
# `infra/network-policy/` مولَّدةٌ منه، تُقاس بمقابلةٍ بايتية لا بمراجعةٍ بالعين.
#
# القاعدة الحاكمة RULE-007: الافتراضُ رفض. غيابُ شاهدٍ على الحصر ليس حالةً محايدة،
# بل هو أولى حالتي الخرق: من لا يستطيع إثبات أنه محصور فهو غير محصور.

policy:
  # لا حصرَ مُدَّعى: كل شرطٍ أدناه يُقرأ من `/proc` للعمليّة الجارية نفسها
  default: "deny"

  # شاهدُ الحصر: جذرُ نظام الملفات الافتراضي الذي تُقرأ منه الحقائق.
  # يُبدَّل في الاختبار بجذرٍ مُصطنع، ولا يُبدَّل في التشغيل.
  witness_root: "/proc"

  # الشروطُ المُلزمة. كلُّ شرطٍ قيمتُه `true` يوجب تحقُّقَه، ومن لم يتحقّق رُفع
  # بسببه المعلن. تعطيلُ شرطٍ هنا فعلُ إنزالٍ للحماية يُقرأ في المراجعة، لا سهو.
  require:
    # المستخدم ليس الجذر: uid ≠ 0 — أوّلُ حدٍّ وأرخصُه، وغيابُه يُبطل ما بعده
    non_root: true
    # لا قدرات فعّالة: CapEff = 0 — العمليّة لا تملك صلاحية نواة واحدة
    no_effective_capabilities: true
    # مجموعةُ الحدّ فارغة: CapBnd = 0 — لا تُستعاد قدرةٌ بملفٍ ذي قدرات ولا بـ setuid
    empty_bounding_set: true
    # منعُ اكتساب صلاحيات جديدة: NoNewPrivs = 1 — يُغلق طريق setuid كلَّه
    no_new_privileges: true
    # مِصفاةُ نداءات النظام قائمة: Seccomp = 2 (filter) — سطحُ النواة مُضيَّق
    seccomp_filter: true
    # جذرُ نظام الملفات للقراءة فقط — لا تُبدَّل شيفرةُ الدولة في زمن التشغيل
    read_only_root: true
    # لا طريقَ خروجٍ افتراضيًّا: صفر مسارات افتراضية خارج الحلقة المحلية.
    # هذا هو الشرطُ الذي تُغلق به فجوةُ C-09: الرفضُ في النواة قبل الشيفرة.
    default_deny_egress: true

  # المنافذ التي لا تقوم شبكةٌ بغيرها. تُدرج في المنشور المولَّد صراحةً، فلا يُفتح
  # منفذٌ ضمنًا ولا يُسكت عن حاجةٍ قائمة.
  infrastructure_ports:
    # ترجمةُ الأسماء: بلا 53 لا يُحلّ اسمُ نظيرٍ معلن، فيصير المنعُ عن غير قصد
    - { name: "dns", port: 53, protocol: "UDP" }
    - { name: "dns-tcp", port: 53, protocol: "TCP" }

  # المنشوراتُ المولَّدة — مسارُها ومحتواها ليسا يدويَّين. المقابلةُ البايتية في
  # `scripts/check_confinement.mjs` هي الحاجز: تحريرٌ يدوي يوسّع الخروج يُكشف رقمًا.
  generated:
    directory: "infra/network-policy"
    default_deny_file: "default-deny-egress.yaml"
    allowlist_file: "allow-declared-counterparties.yaml"
    runtime_file: "infra/docker/compose.yaml"
    # اسمُ الحمولة في العنقود ووسمُها — يُذكران في كل منشور مولَّد
    workload_label: "sool-digital-state"
    namespace: "sool"

  # في وضع الإنتاج: غيابُ الحصر حادثٌ حرج يوقف التشغيل، لا ملاحظةٌ تُرفع.
  # سببُه: التشغيل الاتحادي يُعلن أن لا أثرَ خارجيًّا غيرَ معلن؛ وهذا الإعلان بلا
  # حصرٍ في النواة وعدٌ بلا حاملٍ — والوعدُ بلا حامل هو ما تمنعه RULE-007.
  production_severity: "critical"
