# سياسةُ حاجز النية على مستوى **المعاملات** (المرحلة 39 — البند T-31، إكمالُ C-12)
# المالك: ديوان التدقيق (بمراجعة وزارة الأمن السيبراني)
#
# الفجوةُ التي وُجد هذا الملفُّ لأجلها: حاجزُ النية كان يقيس **اسمَ الأداة** وحده،
# فخطّةٌ تُعلن `calc` تفتح **كلَّ قيم معاملاتها**؛ ومن أعلن `write_file` نال كلَّ
# مسارٍ في الدولة. والنيةُ لا تُقاس بالفعل مجرّدًا عن موضوعه (`verdict.md` §3 — T-31).
#
# وهذا الملفُّ **المصدرُ الوحيد** لهذه الأرقام (RULE-005): لا نسخةَ منها في الشيفرة.
policy:
  default: deny

  # شرطٌ **مُلزم**: لا خطّةَ بلا إعلانِ معاملاتٍ لكلِّ أداة. واسمُ الأداةِ وحده
  # يُقرأ خطوةً بـ**صفرِ معاملاتٍ مباحة** لا خطوةً مفتوحة — فالاختصارُ تضييقٌ لا توسيع.
  require_argument_declaration: true

  # شرطٌ **مُلزم**: معاملٌ لم يُعلَن في الخطة يُرفض ولا يُهمَل. إهمالُ المعامل
  # غيرِ المعلن هو عينُ الفجوة: يمرّ الفعلُ ويتغيّر موضوعُه.
  refuse_undeclared_argument: true

  # أقصى عددِ معاملاتٍ في الخطوة الواحدة. خطوةٌ فوقه تُرفض عند الإعلان:
  # خطّةٌ عريضةٌ بلا حدٍّ تصير تصريحًا عامًّا بصيغة تفصيل.
  max_args_per_step: 6

  # أقصى عددِ قيمٍ معلنةٍ للمعامل الواحد (نمطُ `exact`). ما فوقه تصريحٌ مقنَّع.
  max_values_per_arg: 8

  # أقصى طولِ قيمةٍ معلنة. ما فوقه يُرفض ولا يُقتطع — والقطعُ يُخفي خرقًا.
  max_value_chars: 128

  # أقصى عددِ خطواتٍ في الخطة الواحدة.
  max_steps_per_plan: 16

  # خرقُ المعاملات المسموح: **صفر**. نداءٌ واحدٌ بقيمةٍ لم تُعلَن مرّ = المعيارُ ساقط.
  max_argument_breach: 0

# شدّةُ الحادث في وضع الإنتاج — لا تُخفَّف من التهيئة
production_severity: "critical"
