# سياسة التشغيل المحدود (المرحلة 36) — ما الذي يُعدّ «مدة مراقبة كاملة بلا حادث حرج»
#
# درس المرحلتين 34 و35 منقولٌ هنا: لا يُصدَّق أثرٌ لأن دالةً نُوديت. و«لم يقع حادث»
# دعوى لا تُقبل إلا من مراقبٍ **عمل فعلًا**: القياس أثبت أن حادثين جسيمين بقيا قائمين
# خمسة أضعاف مهلتهما والسجل خالٍ تمامًا ووضع الدولة `normal` — لأن كل ماسحات الدولة
# تنتظر يدًا تناديها، ومؤقّتها الحقيقي واحد (مراقب الملك). فصمت السجل هنا ليس سلامة.
#
# كل رقم وكل علم هنا سياسة يجري إنفاذها: له قيمة تُسقط الإقلاع، وتغييره يغيّر السلوك.
policy:
  # النطاق يُبنى منعًا لا سماحًا: ما لم يُعلن مسموحًا فهو مرفوض عند بوابة التاج نفسها.
  default: deny

  # المراقب ليس المشغّل (RULE-004): من يشغّل النافذة لا يشهد لنفسه أنها مرّت بسلام.
  observer_authority: "authority:audit_bureau"

  window:
    # مدة النافذة الكاملة. قصيرة بالمللي كي تُقاس في اختبار حقيقي لا في محاكاة زمن:
    # النافذة تمرّ بمؤقّت حقيقي، والمدة معلنة كي يُعرف متى «اكتملت» ومتى «قُطعت».
    duration_ms: 1200
    # كل كم مللي ثانية يمسح المراقب الحرّاس المعلنة. مربوط بـ load.yaml: لا يقلّ عن
    # channel_max_ms — فمسحةٌ أسرع من زمن مرور أمر واحد تُنتج حادثًا حتميًّا لا حقيقيًّا.
    tick_ms: 120
    # أقل عدد مسحات تُقبل بها النافذة. نافذةٌ مضت بلا مسح ليست نافذة مراقبة بل انتظارًا،
    # وهذا هو الفرق بين «لم يقع حادث» و«لم ينظر أحد». حدٌّ لا يُسقَط.
    min_ticks: 8

  scope:
    # الأفعال السيادية المسموحة في التشغيل المحدود. الاسم يُقاس على
    # KNOWN_SOVEREIGN_ACTIONS، ففعلٌ مجهول هنا يمنع الإقلاع لا يمرّ صامتًا.
    permitted_actions:
      - "create_agent"
      - "grant_capability"
      - "appoint_official"
      - "terminate_agent"
      - "approve_phase"
    # ما لا يُسمح في التشغيل المحدود مهما صحّ أمره: استيراد من الخارج، وتدريب نموذج،
    # وفتح حساب خارجي، واستعادة أرشيف، وتعديل سياسة. أثرها يتجاوز نطاق المراقبة.
    forbidden_actions:
      - "import_artifact"
      - "train_model"
      - "open_external_account"
      - "archive_restore"
      - "amend_policy"
    # سقف السكان في التشغيل المحدود. مربوط بـ quotas.yaml: لا يتجاوز population_max.
    max_agents: 8

  severity:
    # الحوادث الحرجة: ما يُسقط النافذة كلها بواحدة منه. أسماء تُقاس على الحرّاس المعلنة.
    critical:
      - "authority_without_holder"
      - "crown_domain_drift"
      - "audit_chain_broken"
      - "scope_violation"
      - "terminated_entity_acting"
    # الحوادث الجسيمة: تُسجَّل وتُرفع ولا تُسقط النافذة وحدها.
    high:
      - "overdue_batch"
      - "unresolved_dispute"
      - "expired_retention"

  tolerance:
    # صفرٌ لا يُرفع: شرط القبول يقول «بلا حادث حرج»، فسياسةٌ تسمح بواحد تُبطل الشرط نصًّا.
    max_critical: 0
    # حرسٌ معلن لم يمسح قطّ خرقٌ: نافذةٌ لم يُنظر فيها إلى حرس لا تشهد له بالسلامة.
    max_unwatched: 0
    # مسحة انهارت خرقٌ: صمت الماسح ليس سلامة، وهو أخطر من فشله لأنه يمرّ.
    max_failed_ticks: 0

  # الحرّاس المشترطة في النافذة: كل واحد ماسحٌ حقيقي في وحدة قائمة، يُنادى بمؤقّت
  # لا بيد. الحرس المعلن الذي لا يمسح يُخرج خرقًا، فلا يُعلن حرسٌ زينةً.
  watches:
    - "regions"
    - "audit_chain"
    - "scope"
    - "termination"
    - "king"

  # كتاب التشغيل يُنفَّذ لا يُقرأ: كل خطوة لها فعل وتحقّق، والخطوة التي لم يُثبت
  # تحققها تُفشل الكتاب. الكتب المعلنة هنا شرطُ قبول النافذة.
  require_runbook_execution: true
  runbooks:
    - "limited-operation"
    - "incident-response"
    - "halt-and-recover"

  # المراقب المستقل شرط، والحادث الحرج يوقف الدولة، والخرق يُصعَّد إلى الملك.
  require_independent_observer: true
  halt_on_critical: true
  escalate_on_breach: true
