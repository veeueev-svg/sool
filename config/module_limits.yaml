# config/module_limits.yaml — حدود حجم الوحدة (ورشة الهيكلة: 0.24.0، وتفكيك الجذر: 0.25.0)
# المالك: القيّم على المستودع | يُنفَّذ بـ: scripts/check_module_size.sh
#
# القاعدة: الشفرة لا تُكدَّس في ملف. الملف الذي يتجاوز السقف يصير عنق زجاجة:
# يقرؤه من لا يحتاجه كلّه، ويُعدّله اثنان في الوقت نفسه، ويخفي حدوده عن المراجع.
# السقف رقمٌ معلن هنا لا في الشفرة (التهيئة قبل الشفرة — docs/PHASE_PROCEDURE.md §2).
#
# الاستثناء ليس إعفاءً: هو دَينٌ مسجَّل برقم بنده في PROGRESS.md §2، وبسقفٍ خاصّ
# لا يجوز تجاوزه (سقّاطة: الدَّين ينقص ولا يزيد). ومن يُنقص ملفًا تحت السقف العام
# يحذف صفَّه من هنا — والفحص يفشل إن بقي صفٌّ لم يعد له مبرّر.
ceiling_lines: 400
scope: "src/**/*.ts + tests/**/*.ts + scripts/**/*.ts"
