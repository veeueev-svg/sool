# سياسةُ التوالد وحدودُه (المرحلة 39 — البند T-25، إكمالُ C-11)
# المالك: وزارة الداخلية (بمراجعة وزارة الأمن السيبراني)
#
# الأرقامُ هنا **سياسةٌ يجري إنفاذها** لا أرقامًا وصفيّة: تغييرُ أيٍّ منها يغيّر
# سلوكَ بوابة التوالد فورًا. وهذا الملفُّ **المصدرُ الوحيد** لهذه الحدود — لا
# نسخةَ منها في الشيفرة (RULE-005).
#
# وحدُّ الأجيال يُقاس على **النسب الفعلي** بين المخططات لا على رقمٍ يعلنه المخطط
# عن نفسه: مخططٌ بلا أصلٍ جيلُه 1، ومشتقٌّ جيلُه جيلُ أصله + 1، والدعوى المخالفة
# للنسب مرفوضة. هذا هو نصفُ البند T-25 الأول.
policy:
  default: deny

  # أقصى عمقٍ مسموحٍ لسلسلةِ الاشتقاق. الجيلُ 1 من سلطةٍ بشريّة مباشرة.
  generation_max: 2

  # أقصى عددِ وكلاءَ في دفعةٍ واحدة — الحكمُ على الدفعة كاملةً لا جزئيًّا
  batch_max: 8

  # أقصى توالدٍ في الساعة عبر كل المخططات
  per_hour_max: 32

  # مهلةُ الحجز: حجزٌ لم يُثبَّت ولم يُفرَج عنه خلالها يسقط ويُعاد نصيبُه.
  # بلا مهلةٍ يصير كلُّ مُنادٍ انقطع تسريبًا دائمًا في النصيب المتاح.
  reservation_ttl_ms: 30000

  # أقصى عددِ حجوزاتٍ معلَّقةٍ في وقتٍ واحد — سدٌّ لإغراقِ الحجز بلا تثبيت
  max_outstanding_reservations: 64

# عتباتُ تمرينِ الحمل والتزامن. تجاوزُها **يُفشِل** المسبار ولا يُسجَّل ملاحظة.
load:
  # عددُ الدفعات المتزامنة في التمرين
  concurrent_batches: 64
  # حجمُ كل دفعةٍ في التمرين
  batch_size: 4
  # سقفُ نسخِ المخطط المستخدَم في التمرين
  blueprint_cap: 32
  # خرقُ السقف المسموح: **صفر**. أيُّ نسخةٍ فوق السقف إفشالٌ لا ملاحظة.
  max_cap_breach: 0
  # أقصى زمنٍ للحكم الواحد (p99) وأقصى زمنٍ مطلق — بالمللي ثانية
  decision_p99_ms: 5
  decision_max_ms: 50

# شدّةُ الحادث في وضع الإنتاج — لا تُخفَّف من التهيئة
production_severity: "critical"
