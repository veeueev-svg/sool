# سياسة التشغيل الاتحادي (المرحلة 37) — ما الذي يُعدّ «كل الأقاليم تعمل تحت مرور
# التاج مع مراقبة مستمرة»
#
# درس المرحلة 36 منقولٌ هنا: النافذة المحدودة أثبتت أن المؤقّت يكشف ما تنتظره اليد،
# لكنها انتهت بخمسة حرّاس مربوطين وخمس ماسحات تنتظر نداءً (T-105)، وبمراقبة لها
# «مدة» تنتهي. التشغيل الاتحادي يوجب ثلاثًا لا تُختصر:
#   1) الأقاليم الأربعة **تعمل فعلًا**: قائمة ومفوَّضة ولها حكّام وأفعالها مُقاسة —
#      لا «قائمة» في تقرير.
#   2) **مرور التاج مُنفَّذ**: لا فعل إقليمي ينفُذ بلا قرار بوابة، ويُثبت ذلك بمحاولة
#      تجاوزٍ حقيقية تُرفض وتُقيَّد — لا بقراءة كود.
#   3) **المراقبة مستمرة**: بلا مدة معلنة ولا نهاية، تعبر إعادة التشغيل، وتكشف حادثًا
#      زُرع بعد بدء القياس بلا نداء يدوي.
#
# كل رقم وكل علم هنا سياسة يجري إنفاذها: له قيمة تُسقط الإقلاع، وتغييره يغيّر السلوك.
policy:
  # الافتراض منعٌ لا سماح — كما في التشغيل المحدود، ولا يُرخى في الاتحادي.
  default: deny

  # المراقب ليس المشغّل (RULE-004): من يشغّل الاتحاد لا يشهد لنفسه أنه مراقَب.
  observer_authority: "authority:audit_bureau"

  supervision:
    # كل كم مللي ثانية يمسح المراقب الدائم. لا يقلّ عن channel_max_ms في load.yaml
    # (وإلّا كان الحادث حتميًّا لا حقيقيًّا)، ولا يزيد على tick_ms في staging.yaml
    # (وإلّا كانت المراقبة الدائمة أرخى من المحدودة — وذلك نقضٌ للتدرّج).
    tick_ms: 120
    # أقصى تأخّر مقبول بين إقلاع الدولة وأول مسحة. «من لحظة الإقلاع» تُقاس بهذا الرقم:
    # مراقبةٌ بدأت متأخرة تركت فجوةً غير مراقَبة، وتُعلن خرقًا لا تُبتلع.
    start_grace_ms: 800
    # أقصى صمتٍ مقبول بين مسحتين. تجاوزه فجوةٌ تُقيَّد باسمها: المراقبة التي تتوقف
    # دقيقةً ثم تعود ليست مستمرة، والصمت لا يُحسب سلامة.
    max_silence_ms: 600
    # أقصى فجوة مقبولة عبر إعادة التشغيل: تُقاس من آخر نقطة تفتيش على القرص إلى
    # إقلاع العملية الجديدة. تجاوزها يُعلن ولا يُطوى — إعادة التشغيل لا تمسح الزمن.
    restart_gap_max_ms: 2000
    # أقل عدد مسحات يُحكم بها. مراقبةٌ لم تمسح إلّا مرة ليست مراقبة مستمرة.
    min_sweeps: 4
    # موضع نقطة التفتيش التي تعبر إعادة التشغيل. مجلد مُستثنى من الإصدار (.gitignore)
    # لأنه حالة تشغيل لا وثيقة. ملفٌ معدَّل من الخارج يُرفض ولا يُقرأ كإقلاعٍ أول.
    checkpoint_directory: ".state/production"

  loads:
    # أقصى عمر لأمر أُدرج في دفتر الأحمال ولم يُثبَّت مصيره. تجاوزه فقدٌ يُرفع حادثًا.
    # لا يقلّ عن channel_max_ms في load.yaml: أمرٌ لم يُمهَل زمن مروره ليس فقدًا.
    pending_max_ms: 300

  regions:
    # الأقاليم التي لا يُعدّ التشغيل اتحاديًّا بغيرها. كل معرّف هنا يجب أن يكون معلنًا
    # في config/regions.yaml — إقليم يُشترط ولا يُعلن شرطٌ يستحيل استيفاؤه.
    required:
      - "region:core"
      - "region:research"
      - "region:industry"
      - "region:services"
    # لا فعل إقليمي بلا قرار بوابة التاج. تعطيلها ينقض شرط القبول نصًّا.
    require_crown_passage: true
    # إقليمٌ مفوَّض بلا حاكم سلطةٌ بلا مسؤول — والحكم عليه خرق.
    require_governor: true
    # مدة صلاحية إذن المرور الواحد. إذنٌ لا يشيخ يصير تفويضًا دائمًا بأمر واحد.
    passage_ttl_ms: 2000
    # لا إقليم موقوف في تشغيل يُقال إنه اتحادي كامل.
    max_suspended: 0

  tolerance:
    # صفرٌ لا يُرفع: «مراقبة مستمرة» و«تحت مرور التاج» شرطان لا يقبلان استثناءً واحدًا.
    max_critical: 0
    # ماسحٌ معلن لم يمسح قطّ خرقٌ — درس T-105: حرسٌ لا يمسح أسوأ من غيابه.
    max_unwatched: 0
    # مسحة انهارت خرقٌ: صمت الماسح أخطر من فشله لأنه يمرّ.
    max_failed_sweeps: 0
    # فعلٌ إقليمي نفُذ بلا إذن مرور: نقضُ الشرط نفسه. صفرٌ مطلق.
    max_unpassed_action: 0
    # أقل عدد محاولات تجاوزٍ مرفوضة يُثبت بها الإنفاذ. صفرٌ يعني «مُنفَّذ» بلا دليل،
    # وهذا هو مزلق «القدرة التي لا يناديها أحد» عائدًا في ثوب سياسة.
    min_bypass_proof: 1

  severity:
    # الحرج: ما يُسقط التشغيل بواحدة منه ويوجب التوقف الآمن.
    critical:
      - "authority_without_holder"
      - "crown_domain_drift"
      - "audit_chain_broken"
      - "scope_violation"
      - "terminated_entity_acting"
      - "region_action_without_passage"
      # المرحلة 39 (T-120): حالةٌ لا تنجو من موت العمليّة في تشغيلٍ يُعلن أنه دائم.
      # تصنيفها «جسيمة» يُبقي التشغيل مارًّا على وعدٍ لا حاملَ له، فهي حرجة بالنص.
      - "state_not_durable"
    # الجسيم: يُقيَّد ويُرفع ولا يُسقط التشغيل وحده. محاولة التجاوز **المرفوضة** جسيمة
    # لا حرجة: رفضها دليل إنفاذ، ونفوذها هو الحرج (region_action_without_passage).
    high:
      - "overdue_batch"
      - "unresolved_dispute"
      - "expired_retention"
      - "unit_ledger_mismatch"
      - "command_loss_over_limit"
      - "critical_service_unverified"
      - "crown_passage_bypass"

  # الماسحات المشترطة: الخمسة التي رُبطت في المرحلة 36، والخمسة التي كانت دَينًا
  # مفتوحًا (T-105)، وماسح المرور. كل واحد ينادي وحدة قائمة بمؤقّت لا بيد.
  scanners:
    - "regions"
    - "audit_chain"
    - "scope"
    - "termination"
    - "king"
    - "loads"
    - "digital_unit"
    - "factories"
    - "hospitals"
    - "retention"
    - "passage"
    # المرحلة 39 (T-120): ماسحُ الثبات. حذفُه من هنا يُسقط الإقلاع لأنه مشترطٌ في
    # PRODUCTION_REQUIRED_SCANNERS: تشغيلٌ اتحاديٌ «مستمر» بحالةٍ تموت مع العمليّة
    # ليس مستمرًّا — وهذا هو الدَّين الذي فتحته المرحلة 39 حين جعلت الثبات اختياريًّا.
    - "durable_state"

  # كتاب التشغيل يُنفَّذ لا يُقرأ: لكل خطوة معلنة فعلٌ وتحقّق مربوطان بالرقم.
  require_runbook_execution: true
  runbooks:
    - "federated-operation"
    - "king-absence"

  # المراقبة المستقلة شرط، والحادث الحرج يوقف، والخرق يُصعَّد.
  require_independent_observer: true
  halt_on_critical: true
  escalate_on_breach: true
