# قنواتُ التفاعل المعلنة وعتباتُ كشفِ القناةِ المستورة (المرحلة 39 — البند T-23، إكمالُ C-12)
# المالك: ديوان التدقيق (والاحتواءُ لحرس التاج — RULE-004)
#
# الفجوةُ التي وُجد هذا الملفُّ لأجلها: كشفُ التواطؤ كان يقرأ **تفاعلاتٍ مُبلَّغًا عنها**،
# فمن تواطأ عبر قناةٍ لم يُبلِّغ عنها كان خارج المدى كلِّه (`verdict.md` §3 — T-23).
# وهذا الملفُّ يعلن أمرين: **القنواتُ المسجَّلة** التي لا تفاعلَ إلا بها، و**عتباتُ**
# كشفِ التنسيق الذي يجري بلا أيِّ رسالةٍ معلنة — بالأثر المقيس لا بالنية المُدَّعاة.
#
# وهو **المصدرُ الوحيد** لهذه الأرقام (RULE-005).
policy:
  default: deny

  # شرطٌ **مُلزم**: لا رسالةَ بين كيانين إلا عبر قناةٍ مسجَّلة. القناةُ غيرُ المسجَّلة
  # لا تُسجَّل عند أول استعمال ولا تُنشأ ضمنًا — تُرفض وتُقيَّد تواطؤًا.
  require_registered_channel: true

  # شرطٌ **مُلزم**: مَن ليس من مشتركي القناة لا يرسل فيها ولا يستقبل منها،
  # ولو كانت القناةُ نفسُها مسجَّلة.
  refuse_non_participant: true

  # أقصى عددِ رسائلَ للمشترك الواحد في النافذة — فوقَه ضجيجٌ يُخفي إشارة.
  max_messages_per_window: 32
  window_ms: 60000

covert:
  # نافذةُ الرصد: التنسيقُ يُقاس تقاربًا في الزمن لا تشابهًا في النوع.
  window_ms: 60000

  # أدنى عددِ وكلاءَ يُعَدّ التقاؤهم على **قيمةِ معاملٍ واحدةٍ** موعدًا مستورًا.
  # قيمةٌ نادرةٌ يتفق عليها ثلاثةٌ بلا رسالةٍ معلنةٍ بينهم ليست مصادفة.
  min_rendezvous_parties: 3

  # أدنى عددِ تبادلاتٍ متعاقبةٍ (أ ثم ب ثم أ …) على أداةٍ واحدةٍ لتُعَدّ قناةَ إيقاع.
  min_alternations: 6

  # أقصى فارقٍ زمنيٍّ بين نداءين متعاقبين في قناة الإيقاع.
  max_alternation_gap_ms: 5000

  # الإشارةُ المستورة المسموحة: **صفر**. واحدةٌ تمرّ بلا كشفٍ = المعيارُ ساقط.
  max_undetected_signals: 0

# القنواتُ المسجَّلة. المشتركُ يُطابَق حرفًا، أو بسابقةٍ منتهيةٍ بـ`*`
# (مثل `agent:*`) — والسابقةُ تُعلن هنا فقط، ولا تُشتقّ في الشيفرة.
#
# `anchor`: طرفٌ معيَّنٌ **يجب** أن يكون أحدَ طرفي كلِّ رسالة. وهو **واجبٌ** في كلِّ
# قناةٍ فيها سابقةُ مشتركين: قناةُ `agent:*` بلا مرساةٍ ناقلٌ بين الوكلاء باسمٍ مشروع،
# وهو عينُ ما وُجد هذا الملفُّ لكشفه. والإقلاعُ يسقط إن أُعلنت سابقةٌ بلا مرساة.
channels:
  - id: ch:interior_supervision
    purpose: "إحالةُ الوكلاء إلى مشرفهم وطلبُ التصعيد"
    kinds:
      - referral
      - escalation_request
    participants:
      - "agent:*"
      - "ministry:interior"
    anchor: "ministry:interior"
  - id: ch:crown_guard_reports
    purpose: "تبليغُ حرس التاج بما يستوجب احتواءً"
    kinds:
      - escalation_request
    participants:
      - "ministry:interior"
      - "authority:crown_guard"
      - "authority:audit_bureau"

# شدّةُ الحادث في وضع الإنتاج — لا تُخفَّف من التهيئة
production_severity: "critical"
