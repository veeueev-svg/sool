# سياسة الثبات العام (المرحلة 39 — البند T-27) — لا حالة تُدَّعى ناجيةً بلا وسيط يحملها
# المالك: وزارة البيانات | يقرؤها: src/kernel/config/persistence.ts ⇒ src/data/persistence.ts
#
# القاعدة: ما كُتب في الذاكرة والمعرفة والسجل يُدوَّن على وسيطٍ دائم لحظةَ كتابته،
# لا عند لقطةٍ دورية. لقطةُ المرحلة 32 تحمي من فقد الجهاز، وهذه اليوميّة تحمي من
# فقد العملية بين لقطتين — وهي نطاقُ RPO الحقيقي لا الموعود.
#
# ولكل حدٍّ هنا قيمةٌ تُوقعه: max_journal_records تُختبر بـ3 في
# tests/data/persistence.test.ts، وscope تُختبر بإسقاط memory_record فلا يُدوَّن.
policy:
  journal_directory: "/var/lib/sool/state"
  journal_file: "state.jsonl"
  # مزامنة القرص لكل قيد: وعدُ النجاة من فقد العملية لا يُوفى بذاكرة نظام الملفات
  fsync_every_record: true
  # التحقق من سلسلة اليوميّة عند الإقلاع: يوميّةٌ محرَّفة لا يُبنى عليها إقلاع
  verify_chain_on_boot: true
  # سجل المنتهين يُعاد بناؤه من السلسلة الأبدية عند الإقلاع (البند T-99)
  rebuild_termination_roll: true
  max_journal_records: 500000
  scope:
    - audit_entry
    - memory_record
    - memory_share
    - knowledge_fact
    - archive_snapshot
    # T-121: علامةُ الضغط. صنفٌ لا تُدوّنه وحدةُ حالةٍ قطّ — يكتبه ضاغطُ اليوميّة وحده
    # أوّلَ قيدٍ في الملف الجديد، ويشهد بطول اليوميّة السابقة وبصمةِ رأسها وموضع أرشيفها.
    # حذفُه من النطاق يجعل الملف المضغوط غير مقروءٍ في الإقلاع التالي، فهو مشترطٌ لا زينة.
    - journal_compacted
    # T-122: توسيعُ النطاق إلى أنظمةِ السجل الثلاثة — بعد قياسِ الكلفة لا قبله.
    # المقيسُ (docs/audit/measurements/phase-39-T122-T123.txt): القيدُ الواحد بمزامنةٍ
    # كاملة ≈ 4.34ms و335B عند 50,000 قيد. فالتدوينُ لكلِّ هويّةٍ من مليون هويّة
    # ≈ 72 دقيقة و335MB ويتجاوز max_journal_records — فرُفض تدوينُ الهويّةِ فردًا،
    # ودُوِّنت الدفعةُ دفعةً (population_batch) لأنها وحدةُ الذرّيّة أصلًا (ثابت 3 هناك).
    - ledger_entry
    - contract_record
    - population_batch
    - population_terminated

# T-123: عتبةُ مناداةِ الضغط — انحرافُ الجلسة 32 كان «لا سياسةَ زمنيّة»، وهذه هي.
# الوحدةُ تُنفّذ ولا تُقرّر (RULE-004): `shouldCompact` يُصدر رأيًا معلَّلًا بالعتبة،
# ومن يُنادي `compactJournal` جهةٌ تُقيّد قرارها في السجل الأبدي.
compaction:
  # 100,000 قيد: عند 50,000 قيسَ تحقُّقُ السلسلة بـ401ms، فالعتبةُ هنا تُبقي إقلاعَ
  # الدولة تحت ثانيةٍ واحدة، وهي خُمسُ سقفِ الرفض (500,000) فلا يُبلَغ السقفُ فجأة.
  compact_at_records: 100000
  # ساعةٌ بين ضغطٍ وضغط: الضغطُ يُعيد كتابة الملف كلَّه، ومناداتُه في حلقةٍ ضيّقة
  # تُحوّل حماية القرص إلى استنزافٍ له. صفرٌ ممنوع — «بلا فاصل» ليست سياسة.
  min_interval_ms: 3600000

# T-123: احتفاظُ الأرشيفات — الأصلُ لا يُحذف بلا برهانٍ أن شاهدَه باقٍ.
archives:
  # أحدثُ أرشيفين يبقيان دائمًا مهما بلغ عمرُهما: مقابلةُ المضغوطِ بأصله لا تُفقد.
  keep_min: 2
  # 30 يومًا: ما دون ذلك لا يُمسّ عمرًا، ولو ثبت أنّ شاهدَه باقٍ.
  max_age_ms: 2592000000
  # حرسٌ لا يُعطَّل (RULE-005): لا يُمحى أرشيفٌ إلا بعد إثباتِ تغطيةِ كلِّ قيدٍ فيه
  # في اليوميّة القائمة. `false` هنا رفضُ إقلاعٍ لا خيارَ تشغيل.
  require_witness_coverage: true
