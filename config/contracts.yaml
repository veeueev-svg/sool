# العقود الخارجية (المرحلة 27) — كل التزام تجاه الخارج معلن هنا، لا في الكود
# القاعدة: ما لم يُعلن في هذا الملف لا يقوم عقدٌ خارجي (RULE-005 — لا توسّع من الداخل)
#
# فرق مقصود عن المرحلة 26: قناة المال تُعلَّق **بلا أمر ملكي** لأن التعليق فعل حماية
# رخيص الثمن. أمّا **إنهاء العقد** فهو فعل قانوني يسقط التزامًا ويفتح تسوية، فلا يقع
# إلا **بأمر ملكي** — ويقع في اللحظة نفسها بلا مدة سماح (ADR-0011 قرار 4).

policy:
  # الافتراض رفض: لا عقد إلا بمطابقة نوع معلن وتقدير مخاطر قائم
  default: "deny"
  # شرط القبول المعلن في خارطة الطريق: عقد بلا تاريخ انتهاء يُرفض
  require_end_date: true
  # لا عقد دائم: أقصى مدة لأي عقد خارجي — ولا تجديد ضمني بعدها
  max_term_days: 60
  # الإنهاء فوري: عقد "سيُنهى بعد مدة" عقدٌ قائم لا مُنهًى
  termination: "immediate"
  # الإنهاء بأمر ملكي: إسقاط التزام معلن ليس فعل موظّف
  termination_requires_royal_command: true
  # الإنهاء يقطع قناة المال في اللحظة نفسها — لا عقد مُنهًى وقناته مفتوحة
  termination_suspends_account: true
  # مدة تسوية الالتزامات القائمة بعد الإنهاء، وما لم يُسوَّ يُرفع متأخرًا بلا عقوبة
  settlement_window_hours: 168
  # درجة مخاطر الشريك التي لا يُوقَّع عقد فوقها — سقف من التهيئة لا من تقدير المقدِّر
  max_risk_score: 60
  # التقدير يبلى: عقد على تقدير أقدم من هذه المدة يُرفض
  review_interval_days: 30
  # إخلال موثَّق يُثقل درجة الشريك ولا يُنسى
  breach_penalty: 15
  # حدّ لعدد العقود القائمة لنظير واحد — التفتيت بلا حدّ يُخفي المجموع
  # ولا يُغني هذا الحدّ عن سقف القيمة: العقود الثلاثة قد تتجاوز سقف قناتها مجتمعةً
  max_open_per_counterparty: 3
  # من يقترح العقد ليس من يقدّر مخاطره (RULE-004)
  proposer: "ministry:foreign_affairs"
  assessor: "authority:audit_bureau"
  settler: "ministry:finance"

# أنواع العقود المعلنة — لا عقد لغير هذه المعرّفات، ولكل نوع نظيره وسقف قيمته
kinds:
  - id: "contract:compute-capacity"
    name: "عقد سعة حوسبة معلن"
    counterparty: "external:compute-provider"
    purpose: "شراء سعة حوسبة للنماذج المعتمدة"
    max_value: 20000000
    risk_weight: 25

  - id: "contract:archive-retention"
    name: "عقد حفظ أرشيف خارجي"
    counterparty: "external:data-archive"
    purpose: "حفظ نسخ الأرشيف الملكي خارج المستودع"
    max_value: 8000000
    risk_weight: 15

  - id: "contract:model-weights"
    name: "عقد استيراد أوزان معلن"
    counterparty: "external:model-registry"
    purpose: "استيراد أوزان بأمر واعتماد (المراحل 16–18)"
    max_value: 12000000
    risk_weight: 40

# عوامل المخاطر المعلنة ودرجاتها — الدرجة تُحسب من إعلان لا من حكم شخصي،
# وعامل غير معلن هنا يُرفض التقدير كلّه لأجله (فشل مغلق).
risk_factors:
  data_egress: 20
  model_access: 25
  irreversible_dependency: 30
  single_source: 15
  no_exit_clause: 40
